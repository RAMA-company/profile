<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مترجم رمز امن</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: #fff;
            font-family: Tahoma, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            width: 100%;
            max-width: 600px;
            background-color: #16213e;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        
        h1 {
            text-align: center;
            color: #e94560;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        textarea {
            width: 100%;
            padding: 12px;
            background-color: #0f3460;
            border: 1px solid #e94560;
            border-radius: 5px;
            color: white;
            font-size: 1rem;
            resize: vertical;
            min-height: 100px;
            box-sizing: border-box;
        }
        
        textarea::placeholder {
            color: #a9a9a9;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        button {
            flex: 1;
            padding: 12px;
            background-color: #e94560;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #c73e54;
        }
        
        .output-group {
            position: relative;
        }
        
        .copy-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 8px 12px;
            background-color: #533483;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>مترجم رمز امن</h1>
        
        <div class="input-group">
            <textarea id="inputText" placeholder="Write here..."></textarea>
        </div>
        
        <div class="button-group">
            <button onclick="encode()">رمزگذاری</button>
            <button onclick="decode()">رمزگشایی</button>
        </div>
        
        <div class="output-group">
            <textarea id="outputText" readonly></textarea>
            <button class="copy-btn" onclick="copyOutput()">کپی</button>
        </div>
    </div>

    <script>
        // مجموعه کاراکترهای روسی (16 حرف مختلف)
        const russianChars = ['а', 'б', 'в', 'г', 'д', 'е', 'ж', 'з', 'и', 'й', 'к', 'л', 'м', 'н', 'о', 'п'];
        
        // مجموعه کاراکترهای چینی (16 حرف مختلف)
        const chineseChars = ['的', '一', '是', '不', '了', '在', '人', '有', '我', '他', '这', '为', '之', '大', '来', '以'];
        
        // تابع برای گرفتن یک عنصر تصادفی از آرایه
        function getRandomChar(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }
        
        // تابع رمزگذاری
        function encode() {
            const input = document.getElementById('inputText').value;
            if (!input) return;
            
            // مرحله 1: تبدیل متن به هگزادسیمال
            let hex = '';
            for (let i = 0; i < input.length; i++) {
                hex += input.charCodeAt(i).toString(16).padStart(2, '0');
            }
            
            // مرحله 2: تبدیل هگزادسیمال به باینری
            let binary = '';
            for (let i = 0; i < hex.length; i++) {
                binary += parseInt(hex[i], 16).toString(2).padStart(4, '0');
            }
            
            // مرحله 3: تبدیل باینری به کاراکترهای تصادفی
            let output = '';
            for (let i = 0; i < binary.length; i++) {
                if (binary[i] === '0') {
                    output += getRandomChar(russianChars);
                } else if (binary[i] === '1') {
                    output += getRandomChar(chineseChars);
                }
            }
            
            document.getElementById('outputText').value = output;
        }
        
        // تابع رمزگشایی
        function decode() {
            const input = document.getElementById('inputText').value;
            if (!input) return;
            
            // مرحله 1: تبدیل کاراکترهای تصادفی به باینری
            let binary = '';
            for (let i = 0; i < input.length; i++) {
                const char = input[i];
                if (russianChars.includes(char)) {
                    binary += '0';
                } else if (chineseChars.includes(char)) {
                    binary += '1';
                }
            }
            
            // مرحله 2: تبدیل باینری به هگزادسیمال
            let hex = '';
            for (let i = 0; i < binary.length; i += 4) {
                const chunk = binary.substr(i, 4);
                if (chunk.length === 4) {
                    hex += parseInt(chunk, 2).toString(16);
                }
            }
            
            // مرحله 3: تبدیل هگزادسیمال به متن
            let output = '';
            for (let i = 0; i < hex.length; i += 2) {
                const hexPair = hex.substr(i, 2);
                if (hexPair) {
                    output += String.fromCharCode(parseInt(hexPair, 16));
                }
            }
            
            document.getElementById('outputText').value = output;
        }
        
        // تابع کپی کردن خروجی
        function copyOutput() {
            const outputText = document.getElementById('outputText');
            outputText.select();
            document.execCommand('copy');
            alert('متن کپی شد!');
        }
    </script>
</body>
</html>
